name: salpyeoon-v2-agent

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 실행 단계
        required: true
        default: discover
        type: choice
        options: [baseline, discover, inform, desire, sell, talk, social, learn, weekly, monthly]
      dry_run:
        description: true면 게시하지 않고 결과만 생성
        required: true
        default: true
        type: boolean
      draft:
        description: dry_run=false일 때 Buffer draft로 저장
        required: true
        default: true
        type: boolean

  schedule:
    - cron: '30 22 * * *'  # 07:30 KST inform
    - cron: '0 2 * * *'    # 11:00 KST desire
    - cron: '10 4 * * *'   # 13:10 KST sell
    - cron: '20 8 * * *'   # 17:20 KST talk
    - cron: '40 11 * * *'  # 20:40 KST social
    - cron: '30 14 * * *'  # 23:30 KST learn
    - cron: '50 14 * * 0'  # Sunday 23:50 KST weekly
    - cron: '0 0 1 * *'    # first day 09:00 KST monthly

permissions:
  contents: read

# State is shared in salpyeoon-images. Never let two runs mutate it at once.
concurrency:
  group: salpyeoon-v2-state
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SALPYEOON_V2_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage and reject stale schedules
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_RUN="true"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 22 * * *") STAGE="inform";  DRY_RUN="false"; DRAFT="false"; HOUR=22; MIN=30 ;;
              "0 2 * * *")   STAGE="desire";  DRY_RUN="false"; DRAFT="false"; HOUR=2;  MIN=0  ;;
              "10 4 * * *")  STAGE="sell";    DRY_RUN="false"; DRAFT="false"; HOUR=4;  MIN=10 ;;
              "20 8 * * *")  STAGE="talk";    DRY_RUN="false"; DRAFT="false"; HOUR=8;  MIN=20 ;;
              "40 11 * * *") STAGE="social";  DRY_RUN="false"; DRAFT="false"; HOUR=11; MIN=40 ;;
              "30 14 * * *") STAGE="learn";   DRY_RUN="false"; DRAFT="false"; HOUR=14; MIN=30 ;;
              "50 14 * * 0") STAGE="weekly";  DRY_RUN="false"; DRAFT="false"; HOUR=14; MIN=50 ;;
              "0 0 1 * *")   STAGE="monthly"; DRY_RUN="false"; DRAFT="false"; HOUR=0;  MIN=0  ;;
              *)
                echo "Unknown cron: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac

            # GitHub scheduled runs can be delayed. Work out the most recent intended
            # UTC slot and reject anything more than 90 minutes late.
            NOW_EPOCH="$(date -u +%s)"
            TODAY="$(date -u +%Y-%m-%d)"
            TARGET_EPOCH="$(date -u -d "${TODAY} $(printf '%02d:%02d' "$HOUR" "$MIN"):00" +%s)"
            if [ "$TARGET_EPOCH" -gt "$NOW_EPOCH" ]; then
              TARGET_EPOCH=$((TARGET_EPOCH - 86400))
            fi
            LATE_SECONDS=$((NOW_EPOCH - TARGET_EPOCH))

            if [ "$LATE_SECONDS" -gt 5400 ]; then
              SHOULD_RUN="false"
              echo "Stale scheduled run rejected: ${LATE_SECONDS}s late"
            fi
          else
            STAGE="${{ inputs.stage }}"
            DRY_RUN="${{ inputs.dry_run }}"
            DRAFT="${{ inputs.draft }}"
          fi

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

          echo "Resolved stage=$STAGE"
          echo "Resolved dry_run=$DRY_RUN"
          echo "Resolved draft=$DRAFT"
          echo "Resolved should_run=$SHOULD_RUN"

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.cfg.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Clone state repository
        if: steps.cfg.outputs.should_run == 'true'
        env:
          IMAGES_TOKEN: ${{ secrets.SALPYEOON_IMAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone "https://x-access-token:${IMAGES_TOKEN}@github.com/${OWNER}/salpyeoon-images.git" state-repo
          mkdir -p state-repo/data/v2

      - name: Run agent stage
        if: steps.cfg.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        shell: bash
        run: |
          EXTRA=""

          if [ "${{ steps.cfg.outputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --no-publish"
          fi

          if [ "${{ steps.cfg.outputs.draft }}" = "true" ]; then
            EXTRA="$EXTRA --draft"
          fi

          python -m src.run_stage \
            --stage "${{ steps.cfg.outputs.stage }}" \
            --state-dir state-repo/data/v2 \
            $EXTRA | tee run-output.json

      - name: Save agent state
        if: always() && steps.cfg.outputs.should_run == 'true'
        env:
          IMAGES_TOKEN: ${{ secrets.SALPYEOON_IMAGES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd state-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/v2

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "salpyeoon v2 state: ${{ steps.cfg.outputs.stage }}"

          # A different writer may have changed salpyeoon-images. Rebase and retry
          # instead of losing this run with a non-fast-forward error.
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "State push retry $n/3"
            sleep $((n * 2))
          done

          echo "State push failed after retries"
          exit 1

      - name: Upload run result
        if: always() && steps.cfg.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salpyeoon-v2-${{ steps.cfg.outputs.stage }}-${{ github.run_id }}
          path: run-output.json
          if-no-files-found: ignore
