name: heaf-threads

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Content slot"
        required: true
        default: "0"
        type: choice
        options: ["0", "1", "2"]
      publish:
        description: "Publish to @agewellkoreanstyle Threads now"
        required: true
        default: false
        type: boolean
      draft:
        description: "If publish=true, save as Buffer draft instead of sending live"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  heaf-threads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate HEAF Threads post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          HEAF_THREADS_HANDLE: agewellkoreanstyle
          HEAF_EBOOK_URL: ${{ vars.HEAF_EBOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ inputs.publish }}" = "true" ]; then
            EXTRA="$EXTRA --publish"
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            EXTRA="$EXTRA --draft"
          fi
          python -m src.heaf_threads --slot "${{ inputs.slot }}" $EXTRA | tee heaf-threads-output.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heaf-threads-${{ github.run_id }}
          path: heaf-threads-output.json
          if-no-files-found: ignore
