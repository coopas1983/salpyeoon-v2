name: salpyeoon-v2-agent

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 실행 단계
        required: true
        default: discover
        type: choice
        options: [baseline, discover, inform, desire, sell, talk, social, learn, weekly, monthly]
      dry_run:
        description: true면 게시하지 않고 결과만 생성
        required: true
        default: true
        type: boolean
      draft:
        description: dry_run=false일 때 Buffer draft로 저장
        required: true
        default: true
        type: boolean

  # 아래 스케줄은 Repository variable SALPYEOON_V2_ENABLED=true 일 때만 실제 job이 실행됩니다.
  # UTC 기준 / 한국시간: 07:30, 11:00, 13:10, 17:20, 20:40, 23:30
  schedule:
    - cron: '30 22 * * *'  # 07:30 KST inform (+ discover 자동)
    - cron: '0 2 * * *'    # 11:00 KST desire
    - cron: '10 4 * * *'   # 13:10 KST sell
    - cron: '20 8 * * *'   # 17:20 KST talk
    - cron: '40 11 * * *'  # 20:40 KST social
    - cron: '30 14 * * *'  # 23:30 KST learn
    - cron: '50 14 * * 0'  # 일요일 23:50 KST weekly review
    - cron: '0 0 1 * *'    # 매월 1일 09:00 KST monthly strategy

permissions:
  contents: read

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SALPYEOON_V2_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 22 * * *") STAGE="inform" ;;
              "0 2 * * *") STAGE="desire" ;;
              "10 4 * * *") STAGE="sell" ;;
              "20 8 * * *") STAGE="talk" ;;
              "40 11 * * *") STAGE="social" ;;
              "30 14 * * *") STAGE="learn" ;;
              "50 14 * * 0") STAGE="weekly" ;;
              "0 0 1 * *") STAGE="monthly" ;;
              *) echo "Unknown cron"; exit 1 ;;
            esac
            DRY_RUN="false"
            DRAFT="false"
          else
            STAGE="${{ inputs.stage }}"
            DRY_RUN="${{ inputs.dry_run }}"
            DRAFT="${{ inputs.draft }}"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clone state repository
        env:
          IMAGES_TOKEN: ${{ secrets.SALPYEOON_IMAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone "https://x-access-token:${IMAGES_TOKEN}@github.com/${OWNER}/salpyeoon-images.git" state-repo
          mkdir -p state-repo/data/v2

      - name: Run agent stage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.cfg.outputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --no-publish"; fi
          if [ "${{ steps.cfg.outputs.draft }}" = "true" ]; then EXTRA="$EXTRA --draft"; fi
          python -m src.run_stage --stage "${{ steps.cfg.outputs.stage }}" --state-dir state-repo/data/v2 $EXTRA | tee run-output.json

      - name: Save agent state
        if: always()
        env:
          IMAGES_TOKEN: ${{ secrets.SALPYEOON_IMAGES_TOKEN }}
        shell: bash
        run: |
          cd state-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v2
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "salpyeoon v2 state: ${{ steps.cfg.outputs.stage }}"
            git push origin HEAD:main
          fi

      - name: Upload run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salpyeoon-v2-${{ steps.cfg.outputs.stage }}-${{ github.run_id }}
          path: run-output.json
          if-no-files-found: ignore
